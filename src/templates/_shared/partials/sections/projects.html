{{#if items.length}}
  {{#if featured.length}}
    <div class="project-grid project-grid--featured">
      {{#each featured}}{{> components/project-card this}}{{/each}}
    </div>
  {{/if}}
  {{#if rest.length}}
    <div class="project-grid">
      {{#each rest}}{{> components/project-card this}}{{/each}}
    </div>
  {{/if}}
{{else}}
  <p class="empty">No projects yet.</p>
{{/if}}
