<!doctype html>
<html lang="{{site.language}}"{{#if theme.mode}} data-mode="{{theme.mode}}"{{/if}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="{{site.themeColor}}">
  {{#if assets.favicon}}<link rel="icon" href="{{assets.favicon}}"{{#if assets.faviconType}} type="{{assets.faviconType}}"{{/if}}>{{/if}}
  {{#if assets.manifest}}<link rel="manifest" href="{{assets.manifest}}">{{/if}}
  {{#if theme.fontUrl}}<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="{{theme.fontUrl}}">{{/if}}
  {{#each assets.preload}}<link rel="preload" as="{{as}}" href="{{href}}"{{#if type}} type="{{type}}"{{/if}}>{{/each}}
  {{#each assets.stylesheets}}<link rel="stylesheet" href="{{this}}">{{/each}}
  {{{assets.headScript}}}
  {{{head}}}
</head>
<body class="no-js theme-developer">
  <a class="skip-link" href="#main">Skip to content</a>
  {{> nav}}
  <main id="main">
    {{{body}}}
  </main>
  {{> footer}}
  {{#each assets.scripts}}<script src="{{this}}" defer></script>{{/each}}
  {{{bodyEnd}}}
</body>
</html>
