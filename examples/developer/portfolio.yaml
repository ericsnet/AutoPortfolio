projects:
  - name: EricSearch
    slug: ericsearch
    tagline: A search engine written from scratch in Rust, from inverted index to ranking.
    description: >-
      An end-to-end search engine — crawler, inverted index, BM25 ranking and a
      query planner — plus benchmarks against Lucene on the same corpus.
    details: |
      EricSearch started as a "can I build this in a weekend" bet and turned into
      a two-year study of information retrieval.

      ## Architecture

      The index is a segmented, memory-mapped inverted index. Segments are
      immutable once written, which makes concurrent readers trivial and keeps
      the write path to a single append-only journal.

      ```rust
      pub struct Segment {
          terms: Fst<Vec<u8>>,
          postings: Mmap,
          doc_lengths: Vec<u32>,
      }
      ```

      Queries compile into a small execution plan: term lookups become posting
      list iterators, then a WAND-style scorer prunes candidates early.

      ## What I learned

      - Memory mapping beats `read(2)` for this workload, but only once the
        access pattern is sequential per segment.
      - BM25's parameters matter far less than good tokenisation.
      - Benchmarks are a feature: without a harness I optimised the wrong thing
        three separate times.
    features:
      - Incremental indexing with crash recovery
      - BM25 ranking with per-field boosts
      - Fuzzy matching over a Levenshtein automaton
      - Query planner with early termination
      - Benchmarks against Lucene on the same corpus
    technologies:
      - name: Rust
        url: https://www.rust-lang.org
      - SQLite
      - name: Tantivy
        url: https://github.com/quickwit-oss/tantivy
    images:
      - src: assets/images/search.svg
        alt: Query latency graph showing p99 dropping from 240 ms to 18 ms
        caption: p99 latency after moving to memory-mapped segments.
    cover:
      src: assets/images/search.svg
      alt: EricSearch query latency chart
    github: https://github.com/eric/ericsearch
    liveUrl: https://ericsearch.example.com
    status: maintained
    role: Creator and maintainer
    start: 2021-03
    end: present
    featured: true
    tags: [systems, search, rust]
    metrics:
      - label: Documents indexed
        value: 42M
      - label: p99 query latency
        value: 18 ms
      - label: GitHub stars
        value: 2.1k
    license: MIT

  - name: Pulse
    tagline: Zero-config observability for small teams — traces, metrics and logs in one binary.
    description: A single Go binary that ingests OpenTelemetry data, stores it locally and serves a query UI, designed for teams that do not want to run a full observability stack.
    details: |
      Large observability platforms are excellent and completely out of reach for
      a five-person team. Pulse is the 80% case: one binary, one config file, and
      a UI that answers "why is this endpoint slow?" in under a minute.

      Storage is a columnar, time-partitioned layout on the local filesystem with
      an optional S3 backend, so it can run on a single VM and still survive a
      disk failure.
    features:
      - OpenTelemetry OTLP ingestion
      - Columnar storage with automatic retention
      - Trace-to-log correlation
      - Alerting rules in plain YAML
    technologies: [Go, ClickHouse, Vue, OpenTelemetry]
    images:
      - src: assets/images/pulse.svg
        alt: Pulse trace waterfall view
    github: https://github.com/eric/pulse
    liveUrl: https://pulse.example.com
    status: active
    role: Creator
    start: 2023-01
    featured: true
    tags: [observability, go, devtools]
    metrics:
